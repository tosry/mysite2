'**':
  web_trigger:
    lin1:
      runner:
        cpus: 1
      stages:
        - name: 构建当前项目
          image: node:20
          script: npm install -g pnpm && pnpm i && pnpm run docs:build
        - name: 部署到Pages
          imports:
            - https://cnb.cool/tosry/api/-/blob/e2f6ca6483b949ed821a8153f965e3e40d2e5a1b/miyao.yml
          image: node:20
          script: npx edgeone pages deploy ./.vitepress/dist/ -n wwwcn -t $EDGEONE_API_TOKEN